<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地质体建模</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_ver }}">
    <script>
        // 从后端动态获取天地图密钥
        window.ZJ_TIANDITU_KEY = '{{ zj_key }}';
    </script>

    <!-- 如果密钥存在，加载天地图 API -->
    {% if zj_key %}
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk={{ zj_key }}"></script>
    {% else %}
    <script>
        console.warn('⚠️ 天地图密钥未配置，地图功能不可用');
        window.ZJ_TIANDITU_KEY = null;
    </script>
    {% endif %}
    <!-- Proj4js 用于坐标投影转换 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    <!-- Plotly 用于数据说明页面的图表 -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- ========== 头部 ========== -->
        <header class="app-header">
            <h1>🏔️ 三维地质建模与AI辅助分析</h1>
            <p>坐标约定：X=东，Y=北，Z=上</p>
        </header>

        <!-- ========== 主区域 ========== -->
        <div class="main-layout">
            <!-- 左侧/顶部：功能面板 -->
            <aside class="control-panel">
                <!-- 上传区域 -->
                <div class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <p>点击或拖拽上传 Excel</p>
                        <p class="hint">.xlsx / .xls</p>
                        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
                    </div>
                    <div class="file-info" id="fileInfo" style="display:none;">
                        <span id="fileName"></span>
                        <span class="file-size" id="fileSize"></span>
                        <button class="btn-remove" id="removeFile">×</button>
                    </div>
                    <div class="template-link">
                        <a href="/api/template" download>📥 下载模板</a>
                        <button class="btn-preview" id="btnPreviewData">📊 预览数据</button>
                        <button class="btn-preview" id="btnNewSession">🔄 新建会话</button>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-group">
                    <!-- 建模参数分析 -->
                    <div class="sidebar-group">
                        <div class="sidebar-group-title">建模参数分析</div>
                        <div class="sidebar-row">
                            <button class="btn btn-sidebar" id="btnAnalyzeRBF" disabled>
                                <span class="icon">🔬</span> RBF 参数分析
                            </button>
                            <button class="btn btn-sidebar" id="btnAnalyzeKriging" disabled>
                                <span class="icon">📊</span> 克里金参数分析
                            </button>
                        </div>
                        <button class="btn btn-sidebar btn-sidebar-full" id="btnModelParams" disabled>
                            <span class="icon">⚙️</span> 建模参数
                        </button>
                        <div id="krigingParamTimer" class="btn-timer-container"></div>
                        <div id="rbfTimer" class="btn-timer-container"></div>
                    </div>

                    <!-- 可视化建模 -->
                    <div class="sidebar-group">
                        <div class="sidebar-group-title">可视化建模</div>
                        <div class="sidebar-row">
                            <button class="btn btn-sidebar" id="btnDrillViews" disabled>
                                <span class="icon">🔬</span> 钻孔示意图
                            </button>
                            <button class="btn btn-sidebar" id="btnModelViews" disabled>
                                <span class="icon">🏔️</span> 建模示意图
                            </button>
                        </div>
                        <button class="btn btn-sidebar btn-sidebar-full" id="btnInteractive" disabled>
                            <span class="icon">🌐</span> 交互式3D模型
                        </button>
                        <div class="sidebar-row">
                            <button class="btn btn-sidebar" id="btnAIModeling" disabled>
                                <span class="icon">🤖</span> AI 建模
                            </button>
                            <button class="btn btn-sidebar" id="btnMultiviewAI" disabled>
                                <span class="icon">🎨</span> 多视角纹理升级
                            </button>
                        </div>
                        <div id="visTimer" class="btn-timer-container"></div>
                    </div>

                    <!-- 插值分析 -->
                    <div class="sidebar-group">
                        <div class="sidebar-group-title">插值分析</div>
                        <div class="sidebar-row">
                            <button class="btn btn-sidebar" id="btnKriging" disabled>
                                <span class="icon">📊</span> 插值结果对比
                            </button>
                            <button class="btn btn-sidebar" id="btnKrigingAnalysis" disabled>
                                <span class="icon">📊</span> 克里金插值（2D）
                            </button>
                        </div>
                        <div id="interpTimer" class="btn-timer-container"></div>
                    </div>
                    
                </div>

                <!-- 运行状态提示栏（固定在左侧底部） -->
                <div class="status-section" id="statusSection">
                    <div class="status-bar-header">
                        <span class="status-bar-icon">📋</span>
                        <span class="status-bar-title">运行信息</span>
                        <span class="status-bar-dots">
                            <span class="dot dot-green"></span>
                            <span class="dot dot-yellow"></span>
                            <span class="dot dot-red"></span>
                        </span>
                    </div>
                    <div class="status-body" id="statusBody">
                        <div class="status-message" id="statusMessage">加载模板数据...</div>
                    </div>
                </div>
            </aside>

            <!-- 右侧/主体：结果显示区 -->
            <div class="result-panel">
                <div class="result-tabs" id="resultTabs" style="display:none;">
                    <button class="result-tab active" data-tab="visual" id="tabVisual">
                        📊 可视化结果
                    </button>
                    <button class="result-tab" data-tab="report" id="tabReport">
                        📈 数据说明
                    </button>
                </div>
                <div class="results-section" id="resultsSection">
                    <!-- 钻孔角度示意模型（默认显示） -->
                    <div id="drillModelContainer" style="flex:1; width:100%; min-height:0; border-radius:8px; overflow:hidden; background:#f0f0f0;">
                        <iframe src="/static/drillAngleExplain.HTML"
                                style="width:100%;height:100%;border:none;"
                                allowfullscreen>
                        </iframe>
                    </div>
                    <!-- 其他结果将追加到此（如轮播图等） -->
                    <div id="resultsContent"></div>
                </div>
                <div class="report-section" id="reportSection" style="display:none;">
                    <!-- 数据说明由 JS 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 数据预览弹窗 ==================== -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">📊 数据预览（模板数据）</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Tab 切换 -->
                <div class="modal-tabs" id="modalTabs">
                    <button class="tab-btn active" data-tab="location">定位表</button>
                    <button class="tab-btn" data-tab="survey">测斜表</button>
                    <button class="tab-btn" data-tab="lithology">岩性表</button>
                    <button class="tab-btn" data-tab="map">点位展示</button>
                </div>
                <!-- 控制栏 -->
                <div class="modal-controls" id="modalControls">
                    <div class="page-size-control">
                        <label>每页显示：</label>
                        <select id="pageSizeSelect">
                            <option value="10">10行</option>
                            <option value="20" selected>20行</option>
                            <option value="30">30行</option>
                            <option value="50">50行</option>
                            <option value="100">100行</option>
                        </select>
                    </div>
                    <div class="data-info" id="dataInfo">
                        共 <span id="totalRows">0</span> 行
                    </div>
                </div>
                <!-- 地图容器 -->
                <div class="map-container" id="mapContainer" style="display:none;height:500px;border-radius:6px;overflow:hidden;background:#f0f0f0;">
                    <div id="previewMap" style="width:100%;height:100%;"></div>
                    <div style="text-align:center;padding:4px;font-size:12px;color:#888;background:#f9f9f9;">钻孔点位分布（点击标记查看详情）</div>
                </div>
                <!-- 表格容器 -->
                <div class="table-wrapper" id="tableWrapper">
                    <table class="modal-table" id="previewTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <!-- 分页 -->
                <div class="pagination" id="pagination">
                    <button class="page-btn" id="prevPage" disabled>&lt;</button>
                    <span class="page-info" id="pageInfo">第 1 / 1 页</span>
                    <button class="page-btn" id="nextPage" disabled>&gt;</button>
                </div>
            </div>
            <div class="modal-footer">
                <span class="data-source" id="dataSource">数据来源：模板数据</span>
                <button class="btn-close" id="modalCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- ==================== 全屏放大 ==================== -->
    <div class="fullscreen-overlay" id="fullscreenModal">
        <div class="fullscreen-container">
            <button class="fullscreen-close" id="fullscreenClose">&times;</button>
            <img id="fullscreenImage" src="" alt="放大图片">
        </div>
    </div>

    <!-- ==================== 交互式3D弹窗 ==================== -->
    <div class="interactive-overlay" id="interactiveModal">
        <div class="interactive-container">
            <button class="interactive-close" id="interactiveClose">&times;</button>
            <div class="interactive-content" id="interactiveContent">
                <!-- 由 JS 动态填充双窗3D iframe -->
            </div>
        </div>
    </div>

    <!-- ==================== 图层选择弹窗（RBF参数分析用） ==================== -->
    <div class="modal-overlay" id="layerSelectModal" style="display:none;">
        <div class="modal-container" style="max-width:420px;">
            <div class="modal-header">
                <h2>🔬 选择分析范围</h2>
                <button class="modal-close" id="layerSelectClose">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:12px;color:#555;font-size:14px;">请选择要分析的岩性层：</p>
                <div id="layerSelectOptions" style="max-height:300px;overflow-y:auto;"></div>
            </div>
            <div class="modal-footer" style="justify-content:flex-end;gap:8px;">
                <button class="btn-close" id="layerSelectCancel">取消</button>
                <button class="btn btn-primary" id="layerSelectConfirm" style="padding:6px 20px;">开始分析</button>
            </div>
        </div>
    </div>

    <!-- 配置 -->
    <script>
        const ZJ_TIANDITU_KEY = '{{ zj_key }}';
        const ZJ_TIANDITU_HOST = '{{ zj_host }}';
        window.ZJ_TIANDITU_KEY = ZJ_TIANDITU_KEY;
        window.ZJ_TIANDITU_HOST = ZJ_TIANDITU_HOST;
    </script>
    <script src="/static/js/main.js?v={{ static_ver }}"></script>
</body>
</html>
