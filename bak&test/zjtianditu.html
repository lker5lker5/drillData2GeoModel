<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浙江天地图 - 钻孔定位叠加</title>
    <!-- 天地图 JavaScript API 4.0 -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=bfc9dea0d2d01bf8b47ded0136142bf0"></script>
    <!-- Proj4js 用于坐标投影转换 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            font-size: 14px;
            color: #333;
            pointer-events: none;
            text-align: center;
            border: 1px solid #e8e8e8;
            white-space: nowrap;
        }
        .info strong {
            color: #1a73e8;
        }
        .info code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 13px;
            border: 1px solid #ddd;
        }
        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff4d4f;
            border-radius: 50%;
            margin-right: 6px;
        }
        /* 信息窗口内表格样式（与官方示例风格保持一致） */
        .borehole-info {
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.6;
        }
        .borehole-info .title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
            color: #1a73e8;
        }
        .borehole-info table {
            width: 100%;
            border-collapse: collapse;
        }
        .borehole-info td {
            padding: 2px 6px;
        }
        .borehole-info .label {
            color: #666;
            text-align: right;
            width: 45%;
        }
        .borehole-info .value {
            font-weight: 500;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="info">
        🌍 <strong>浙江天地图</strong> · 钻孔定位叠加（共 <span id="count">0</span> 个点）
        <span style="margin-left:16px;font-weight:normal;color:#666;">
            ⚠️ 请替换 <code>tk=您的密钥</code> 为实际密钥
        </span>
    </div>
    <div class="legend">
        <span></span> 钻孔位置（点击查看完整信息）
    </div>
    <div id="map"></div>

    <script>
        // ================================================================
        // 1. 钻孔定位数据（来自“定位表”）
        //    坐标：CGCS2000 3度带高斯投影，带号40，中央经线120°E
        // ================================================================
        const boreholes = [
            { id: 'ZK1301', E: 40420450.71, N: 3196271.99, R: 299.5, length: 140.03 },
            { id: 'ZK902',  E: 40420252.16, N: 3196255.73, R: 319.77, length: 293.18 },
            { id: 'ZK903',  E: 40420268.08, N: 3196184.65, R: 355.8,  length: 217.35 },
            { id: 'ZK501',  E: 40420069.94, N: 3196155.57, R: 355.8,  length: 249.22 },
            { id: 'ZK502',  E: 40420101.77, N: 3196107.44, R: 326.3,  length: 503.72 },
            { id: 'ZK503',  E: 40420124.74, N: 3196002.99, R: 282.87, length: 250.3 },
            { id: 'ZK101',  E: 40419898.35, N: 3196033.04, R: 378.19, length: 240.52 },
            { id: 'ZK103',  E: 40419950.20, N: 3195914.88, R: 280.58, length: 300.32 },
            { id: 'ZK201',  E: 40419693.55, N: 3196005.69, R: 305.35, length: 137.73 },
            { id: 'ZK202',  E: 40419703.09, N: 3195970.93, R: 307.96, length: 240.1 },
            { id: 'ZK601',  E: 40419511.15, N: 3195947.43, R: 227.01, length: 101.89 },
            { id: 'ZK602',  E: 40419534.62, N: 3195876.86, R: 217.65, length: 219.95 },
            { id: 'ZK1001', E: 40419320.55, N: 3195857.04, R: 161.1,  length: 141.17 }
        ];

        // ================================================================
        // 2. 投影转换（CGCS2000 3度带带号40 → 经纬度）
        // ================================================================
        const projSrc = '+proj=tmerc +lat_0=0 +lon_0=120 +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs';
        const projDst = '+proj=longlat +ellps=GRS80 +no_defs';

        proj4.defs('EPSG:4547', projSrc);
        proj4.defs('EPSG:4490', projDst);

        function convertToLngLat(E, N) {
            const zone = 40;
            const E_natural = E - zone * 1000000;
            const coords = proj4('EPSG:4547', 'EPSG:4490', [E_natural, N]);
            return coords; // [lng, lat]
        }

        // ================================================================
        // 3. 初始化地图
        // ================================================================
        var map = new T.Map('map');
        var center = new T.LngLat(120.2, 30.3);
        map.centerAndZoom(center, 9);

        map.addControl(new T.Control.Zoom());
        map.addControl(new T.Control.Scale());
        map.addControl(new T.Control.OverviewMap());

        // ================================================================
        // 4. 叠加钻孔点（完全参照官方示例的 infoWindow 用法）
        // ================================================================
        const markerGroup = [];
        let pointCount = 0;

        boreholes.forEach(item => {
            const [lng, lat] = convertToLngLat(item.E, item.N);
            if (isNaN(lng) || isNaN(lat)) {
                console.warn(`转换失败: ${item.id}`);
                return;
            }

            const lngLat = new T.LngLat(lng, lat);
            const marker = new T.Marker(lngLat);
            map.addOverLay(marker);

            // 点击事件 – 使用官方推荐方式：marker.openInfoWindow(infoWin)
            marker.addEventListener('click', function () {
                // 动态构建信息窗口内容（HTML字符串）
                const htmlContent = `
                    <div class="borehole-info">
                        <div class="title">🔹 ${item.id}</div>
                        <table>
                            <tr><td class="label">开孔坐标 E</td><td class="value">${item.E.toFixed(2)}</td></tr>
                            <tr><td class="label">开孔坐标 N</td><td class="value">${item.N.toFixed(2)}</td></tr>
                            <tr><td class="label">开孔高程 R</td><td class="value">${item.R.toFixed(2)} m</td></tr>
                            <tr><td class="label">钻孔长度</td><td class="value">${item.length.toFixed(2)} m</td></tr>
                            <tr><td class="label">转换经纬度</td><td class="value">${lng.toFixed(6)}, ${lat.toFixed(6)}</td></tr>
                        </table>
                    </div>
                `;
                // 创建信息窗口（直接传入 HTML 字符串，与官方示例一致）
                var infoWin = new T.InfoWindow(htmlContent);
                // 使用标记的 openInfoWindow 方法打开
                marker.openInfoWindow(infoWin);
            });

            markerGroup.push(marker);
            pointCount++;
        });

        document.getElementById('count').textContent = pointCount;

        if (markerGroup.length > 0) {
            const bounds = new T.LngLatBounds();
            markerGroup.forEach(m => {
                bounds.extend(m.getLngLat());
            });
            map.fitBounds(bounds, { padding: 40 });
        }

        console.log(`✅ 成功叠加 ${pointCount} 个钻孔点，点击标记可查看完整定位信息。`);
        console.log('💡 信息窗口采用官方示例的 marker.openInfoWindow() 方式打开。');
    </script>
</body>
</html>
